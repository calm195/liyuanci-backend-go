# 与生产隔离；无预设密码，禁止此配置用于生产或性能验收。
name: liyuanci-foundation
x-app: &app
  build:
    context: ../..
    args:
      GOPROXY: ${LIYUANCI_BUILD_GOPROXY:-https://goproxy.cn,direct}
  init: true
  stop_grace_period: 30s
  environment: &env
    APP_DATABASE_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
  networks: [foundation]
  restart: "no"
services:
  api:
    <<: *app
    command: ["-config", "configs/app/integration.yaml"]
    # API增加独立入口网络供loopback发布端口；中间件仍仅在internal网络。
    networks: [foundation, ingress]
    ports: ["127.0.0.1:${LIYUANCI_DEV_API_PORT:-18080}:8080"]
    healthcheck:
      # 基础阶段仅存活可通过；认证/密钥未实现的readyz仍应503。
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      broker: {condition: service_healthy}
  worker:
    <<: *app
    entrypoint: ["./worker"]
    command: ["-config", "configs/app/integration.yaml"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      broker: {condition: service_healthy}
  probe:
    <<: *app
    profiles: [tools]
    entrypoint: ["./probe"]
    command: ["-config", "configs/app/integration.yaml"]
  business-test:
    profiles: [tools]
    build:
      context: ../..
      target: business-test
      args:
        GOPROXY: ${LIYUANCI_BUILD_GOPROXY:-https://goproxy.cn,direct}
    init: true
    entrypoint: [/bin/sh, -c]
    command: ["/foundation.test -test.v -test.run '^TestPostgresWhisperFoundation$$' -test.timeout 180s && /command.test -test.v -test.run '^TestPostgresWhisperLocks$$' -test.timeout 180s && /whisper.test -test.v -test.run '^TestPostgresWhisper(Text|Moderation)$$' -test.timeout 180s && /whisperapp.test -test.v -test.run '^TestPostgres(WhisperRuntime|LocalBusiness)$$' -test.timeout 240s && /whisperrate.test -test.v -test.run '^TestRedisWhisperAdmission$$' -test.timeout 60s && /durable.test -test.v -test.run '^TestPostgres' -test.timeout 180s && /business.test -test.v -test.run '^TestBusinessMessageChain$$' -test.timeout 180s && /wish.test -test.v -test.run '^TestPostgres(Lifecycle|PublicProfile)$$' -test.timeout 180s && exec /moderation.test -test.v -test.run '^Test(ModerationCore|ApplicationMatching|ChatDelivery|StorySharing|SafetyGovernance|CrisisCare|PrivacyDeletion)$$' -test.timeout 420s"]
    environment:
      APP_WHISPER_SERVER_BINARY: /server
      APP_WHISPER_CONTENT_BINARY: /content-worker
      APP_WHISPER_PRIVACY_BINARY: /privacy-worker
      APP_WHISPER_TEXT_TEST_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_WHISPER_REDIS_TEST_ADDRESS: redis:6379
      APP_WHISPER_SCHEMA_TEST_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_WHISPER_COMMAND_TEST_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_RECOVERY_TEST_DSN: "host=recovery-postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_MODERATION_TEST_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_MODERATION_TEST_NAMESERVER: namesrv:9876
      APP_WISH_LIFECYCLE_TEST_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_DURABLE_TEST_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_BUSINESS_TEST_DSN: "host=postgres user=liyuanci password=${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password} dbname=liyuanci sslmode=disable connect_timeout=5"
      APP_BUSINESS_TEST_REDIS: redis:6379
      APP_BUSINESS_TEST_NAMESERVER: namesrv:9876
      APP_BUSINESS_TEST_WORKER_BINARY: /card-worker
      APP_CONTENT_TEST_WORKER_BINARY: /content-worker
    networks: [foundation]
    restart: "no"
  migrate:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    profiles: [tools]
    environment:
      PGPASSWORD: ${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password}
    entrypoint: [psql, -h, postgres, -U, liyuanci, -d, liyuanci, -v, ON_ERROR_STOP=1, -f, /migrations/0001_probe.up.sql]
    volumes: ["../../migrations/integration:/migrations:ro"]
    networks: [foundation]
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: liyuanci
      POSTGRES_USER: liyuanci
      POSTGRES_PASSWORD: ${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password}
    volumes: ["pg-data:/var/lib/postgresql"]
    networks: [foundation]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U liyuanci -d liyuanci"]
      interval: 3s
      timeout: 3s
      retries: 30
  recovery-postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: liyuanci
      POSTGRES_USER: liyuanci
      POSTGRES_PASSWORD: ${LIYUANCI_TEST_DB_PASSWORD:?set isolated test password}
    volumes: ["recovery-data:/var/lib/postgresql"]
    networks: [foundation]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U liyuanci -d liyuanci"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2.12@sha256:16623900b6ddd58e8bac04ccb6b611b9a5d1aed165453e28bcaed251d549d62c
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis-data:/data"]
    networks: [foundation]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  mq-init:
    extends: {file: mq.yaml, service: mq-init}
  namesrv:
    extends: {file: mq.yaml, service: namesrv}
  broker:
    extends: {file: mq.yaml, service: broker}

networks:
  foundation: {internal: true}
  ingress: {}
volumes:
  pg-data:
  redis-data:
  mq-data:

  recovery-data:
