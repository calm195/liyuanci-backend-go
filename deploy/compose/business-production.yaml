# 与production.yaml组合使用。只运行已构建且固定digest的业务镜像，不运行开发进程。
# 每个进程挂载自己的私有目录，恢复日志库由独立故障域提供，不在此创建同机替代品。
x-business: &business
  image: ${LIYUANCI_BUSINESS_IMAGE:?set immutable business image with sha256 digest}
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=16m,mode=1777]
  restart: unless-stopped
  stop_grace_period: 90s
  networks: [foundation, business-egress]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
x-worker: &worker
  <<: *business
  entrypoint: ["/app/business-worker"]
  environment:
    APP_ENVIRONMENT: production
    APP_BUSINESSFILE: /run/business/runtime.json
services:
  api:
    <<: *business
    entrypoint: ["/app/server"]
    command: ["-config", "/run/business/app.yaml"]
    ports: ["127.0.0.1:${LIYUANCI_PRODUCTION_API_PORT:-18081}:8080"]
    volumes:
      - type: bind
        source: ${LIYUANCI_BUSINESS_API_DIR:?set API-only private directory}
        target: /run/business
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, wget, -q, -T, "20", -O, /dev/null, "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 25s
      start_period: 45s
      retries: 3
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  card-worker:
    <<: *worker
    command: ["-kind", "card"]
    volumes:
      - type: bind
        source: ${LIYUANCI_BUSINESS_CARD_DIR:?set card-worker-only private directory}
        target: /run/business
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
      broker: {condition: service_healthy}
  content-worker:
    <<: *worker
    command: ["-kind", "content"]
    volumes:
      - type: bind
        source: ${LIYUANCI_BUSINESS_CONTENT_DIR:?set content-worker-only private directory}
        target: /run/business
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
      broker: {condition: service_healthy}
  whispers-worker:
    <<: *worker
    command: ["-kind", "whispers"]
    volumes:
      - type: bind
        source: ${LIYUANCI_BUSINESS_WHISPERS_DIR:?set whispers-worker-only private directory}
        target: /run/business
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
      broker: {condition: service_healthy}
  privacy-worker:
    <<: *worker
    command: ["-kind", "account"]
    volumes:
      - type: bind
        source: ${LIYUANCI_BUSINESS_PRIVACY_DIR:?set privacy-worker-only private directory}
        target: /run/business
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
  evidence-worker:
    <<: *worker
    command: ["-kind", "evidence"]
    volumes:
      - type: bind
        source: ${LIYUANCI_BUSINESS_EVIDENCE_DIR:?set evidence-worker-only private directory}
        target: /run/business
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
  business-init:
    <<: *business
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/business-init"]
    volumes:
      - type: bind
        source: ${LIYUANCI_BUSINESS_INIT_DIR:?set initializer-only private directory}
        target: /run/business
        read_only: true
        bind: {create_host_path: false}
networks:
  business-egress: {}
