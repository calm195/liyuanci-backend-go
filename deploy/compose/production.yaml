# 未来生产中间件骨架；本文件不部署业务API/worker。
# 生产独立项目/卷、文件型secret、无宿主中间件端口；上线仍需完成业务与生产验收。
name: liyuanci-production
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
services:
  postgres:
    <<: *runtime
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: liyuanci
      POSTGRES_USER: liyuanci
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["pg-data:/var/lib/postgresql"]
    networks: [foundation]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U liyuanci -d liyuanci"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    <<: *runtime
    image: redis:7.2.12@sha256:16623900b6ddd58e8bac04ccb6b611b9a5d1aed165453e28bcaed251d549d62c
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    secrets: [redis_acl]
    volumes:
      - redis-data:/data
      - ../../configs/middleware/redis.production.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [foundation]
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping 2>&1 | grep -q NOAUTH"]
      interval: 3s
      timeout: 3s
      retries: 30
  # 官方镜像非root用户无法写Docker新建的root属主卷。
  # 仅初始化专用MQ卷权限；Broker继续以镜像的rocketmq用户运行。
  mq-init:
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    working_dir: /
    entrypoint: [sh, -c]
    command: ["chown rocketmq:rocketmq /mq-store && chmod 750 /mq-store"]
    volumes: ["mq-data:/mq-store"]
  namesrv:
    <<: *runtime
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: sh mqnamesrv
    environment: {JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"}
    networks: [foundation]
    healthcheck:
      test: [CMD-SHELL, "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
  broker:
    <<: *runtime
    image: apache/rocketmq:5.3.2@sha256:4a80ff5cd4b0a3d3ef6dc338ce2028a85bd995648cb3aa5c3e753746d2dbc587
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/broker.conf
    environment: {JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"}
    depends_on:
      namesrv: {condition: service_healthy}
      mq-init: {condition: service_completed_successfully}
    volumes:
      - ../../configs/middleware/broker.production.conf:/home/rocketmq/broker.conf:ro
      - type: bind
        source: ${LIYUANCI_MQ_ACL_FILE:?set external plain_acl.yml path}
        target: /home/rocketmq/rocketmq-5.3.2/conf/plain_acl.yml
        read_only: true
        bind: {create_host_path: false}
      - mq-data:/home/rocketmq/store
    networks: [foundation]
    healthcheck:
      test: [CMD-SHELL, "sh mqadmin clusterList -n namesrv:9876 | grep -q broker-a"]
      interval: 5s
      timeout: 5s
      retries: 40
networks:
  foundation: {internal: true}
volumes:
  pg-data:
  redis-data:
  mq-data:
secrets:
  postgres_password:
    file: ${LIYUANCI_POSTGRES_PASSWORD_FILE:?set external postgres password file}
  redis_acl:
    file: ${LIYUANCI_REDIS_ACL_FILE:?set external redis ACL file}
