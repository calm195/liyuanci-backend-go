care:
  version: production-care-20261104-v1
  source: >-
    深圳市康宁医院2026年5月29日广东省12356热线整合公告
    https://www.szknyy.com/gz/xwzx/yydt/content/post_1719309.html；
    广东省人民医院门诊预约指南
    https://www.gdghospital.org.cn/AppointmentGuide/index.html；
    广东省人民医院心理咨询科介绍
    https://www.gdghospital.org.cn/TheDepartments/index_subjectid_39.html；
    北京市通信管理局紧急救助号码说明
    https://bjca.miit.gov.cn/zwgk/tzgg/art/2022/art_8d4eb93ee3424f30826c97ee400e8937.html
  # 关怀资料使用日期格式，与援助目录的时间字段不同。
  verified_at: '2026-11-04'
  hotline_24_hours: '广东省内可拨打12356心理援助热线，服务时间为24小时。其他地区请以当地热线公告为准。'
  appointment: >-
    可通过广东省人民医院官方微信公众号“广东省人民医院”或医院官网
    https://www.gdghospital.org.cn/ 预约心理咨询科等相关门诊；
    出诊、号源和费用以医院当日信息为准，也可选择所在地正规医疗机构。
  notice: >-
    如果你正经历难以承受的情绪，可以联系信任的人陪伴，或主动寻求专业支持。
    如有紧急医疗需要，请拨打120；遇到人身安全威胁，可拨打110。
    本平台提供关怀信息，不能代替医疗诊断、治疗或紧急救援。
