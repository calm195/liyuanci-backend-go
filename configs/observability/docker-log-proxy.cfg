# 拒绝写API、exec、archive；socket的ro挂载不等于API只读。
# Alloy为判断TTY需要inspect；该GET可含环境元数据，代理与Alloy均为高信任组件。
global
  log stdout format raw local0
  maxconn 64
defaults
  mode http
  timeout connect 5s
  timeout client 1h
  timeout server 1h
frontend docker_logs
  bind :2375
  acl read_method method GET HEAD
  acl read_path path_reg ^(/v[0-9.]+)?/(_ping|version|info|networks|containers/json|containers/[a-f0-9]+/(logs|json))$
  http-request deny unless read_method read_path
  default_backend docker_socket
backend docker_socket
  server docker /var/run/docker.sock
