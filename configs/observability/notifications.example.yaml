# T004/REQ-020：仅结构示例，不会自动加载；复制到仓库外并替换真实地址/鉴权。
apiVersion: 1
contactPoints:
  - orgId: 1
    name: liyuanci-oncall
    receivers:
      - uid: liyuanci-oncall-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: https://replace-with-verified-oncall-endpoint.example/alerts
          httpMethod: POST
policies:
  - orgId: 1
    receiver: liyuanci-oncall
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
