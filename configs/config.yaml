server:
  address: "127.0.0.1:8080"
  readtimeout: 5s
  writetimeout: 10s
  shutdowntimeout: 10s
log:
  level: info
database:
  driver: "" # foundation为空；真实环境仅postgres
  dsn: "" # inject APP_DATABASE_DSN; never commit credentials
  maxopen: 20
  maxidle: 5
  maxlifetime: 30m
redis:
  enabled: false
  address: localhost:6379
  password: ""
  db: 0
rocketmq:
  enabled: false
  nameservers: [localhost:9876]
  group: liyuanci-api
