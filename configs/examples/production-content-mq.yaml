# 正式业务通道模板；复制到对应进程的私有配置目录，必须补齐独立ACL凭据。
# 主题提前显式创建，禁止自动创建、探针主题或匿名访问。
mq:
  nameservers: [namesrv:9876]
  topic: liyuanci_content_review_v1
  eventtype: wish.review_requested
  producergroup: liyuanci_content_relay
  consumergroup: liyuanci_content_scan
  instance: liyuanci_content_production
  credentials:
    accesskey: ""
    secretkey: ""
  allowunauthenticated: false
  sendtimeout: 3s
  handlertimeout: 60s
  concurrency: 2
  maxreconsume: 3
  retrydelaylevel: 1
relay:
  databasetimeout: 3s
  sendtimeout: 3s
  leaseduration: 15s
  retrydelay: 5s
  maxattempts: 5
relayinterval: 200ms
scaninterval: 5s
operationtimeout: 60s
