# 复制到API专属私有配置目录；业务JSON与凭据由运维注入，不复用开发配置。
environment: production
businessfile: /run/business/runtime.json
server:
  address: 0.0.0.0:8080
  readtimeout: 15s
  writetimeout: 30s
  shutdowntimeout: 30s
database:
  driver: postgres
redis:
  enabled: true
  address: redis:6379
  username: ""
  passwordfile: /run/business/redis.password
# API只写事务发件箱，独立业务worker使用自己的鉴权MQ配置。
rocketmq:
  enabled: false
