# 5.3.2使用ACL 1.0；外部plain_acl.yml禁止全局白名单。
brokerClusterName=LiyuanciProduction
brokerName=broker-a
brokerId=0
brokerIP1=broker
listenPort=10911
autoCreateTopicEnable=false
aclEnable=true
# 单Broker骨架不提供高可用承诺；同步刷盘不替代外部备份和恢复验收。
flushDiskType=SYNC_FLUSH
# 固定主题/消费组技术指标，禁止使用用户ID作为主题或组名。
metricsExporterType=PROM
metricsPromExporterPort=5557
