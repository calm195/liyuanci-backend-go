# 独立集群，不覆盖系统已有PostgreSQL。Ubuntu官方PGDG包的18系列路径。
listen_addresses = '127.0.0.1'
port = 15432
unix_socket_directories = '/run/liyuanci-postgres'
hba_file = '/etc/liyuanci/native/postgres/pg_hba.conf'
max_connections = 48
shared_buffers = '64MB'
work_mem = '1MB'
maintenance_work_mem = '16MB'
autovacuum_max_workers = 1
max_parallel_workers_per_gather = 0
max_wal_size = '512MB'
min_wal_size = '80MB'
password_encryption = 'scram-sha-256'
fsync = on
synchronous_commit = on
full_page_writes = on
logging_collector = off
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length_on_error = 0
