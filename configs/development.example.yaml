environment: development
# foundation仅健康探针；development为开发装配；business为完整业务；whispers为开发独立树洞。
mode: development
# 唯一应用主密钥：32字节密码学随机值的Base64；程序按环境和用途派生子密钥。所有进程保持一致，已有数据时禁止直接更换。
masterkey: ''
# 唯一数据库配置；API、后台任务、显式迁移使用同一账号。
database:
  # 业务模式显式启用PostgreSQL；公共基础配置不连接数据库。
  driver: postgres
  # PostgreSQL单个主机名或IP，不含端口；IPv6不加方括号，不支持多主机列表。
  host: 127.0.0.1
  # PostgreSQL端口，整数1至65535；默认5432。
  port: 5432
  # PostgreSQL数据库名；须由管理员预先创建。
  name: ''
  # 专用业务库账号，拥有本库对象；禁止超级用户、BYPASSRLS和集群管理权限。
  user: ''
  # 原口令直接写入私有YAML，建议加引号；不读取口令文件或环境变量。
  password: ''
# 共享限流连接；正式业务必须启用鉴权。
redis:
  # 开发业务同样依赖共享限流；公共配置默认关闭。
  enabled: true
  # 监听或连接地址（host:port）；按当前配置块填写。
  address: 127.0.0.1:6379
  # 命名ACL用户；空值使用default用户。
  username: ''
  # 原口令直接写入私有YAML，建议加引号；不读取口令文件或环境变量。
  password: ''
# 本地开发使用真实COS/CI；填写专用开发桶及凭据，不借用生产资源。
business:
  # 后台初始化原口令，至少12字符；只在私有覆盖填写，不自动重置账号。
  adminpassword: ''
  # 真实小程序AppID；不使用示例用户绕过微信身份校验。
  wechatappid: ''
  # 原微信AppSecret，内联单行字符串；至少16字符。
  wechatsecret: ''
  runtime:
    # 仅控制树洞与胶囊模块，不关闭其他业务或持久任务。
    enabled: true
    # 腾讯云原生COS与数据万象CI；启用前填写私有覆盖，普通启动不创建云资源。
    tencent:
      # 完整填写后显式启用；未配置时正式图片扫描失败关闭。
      enabled: true
      # 专用私有桶完整名称（含APPID）；必须从未开启版本控制，禁止开启或暂停。
      bucket: ''
      # 桶所在地域，例如ap-shanghai。
      region: ''
      # 最小权限子账号SecretId；只写私有YAML。
      secretid: ''
      # 子账号SecretKey；只写私有YAML，不提交。
      secretkey: ''
      # CI已开通并绑定该桶的审核策略标识，必须显式填写。
      biztype: ''
