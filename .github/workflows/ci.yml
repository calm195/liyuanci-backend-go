name: 工程质量检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: make fmt
      - run: git diff --exit-code
      - run: make check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: make build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: liyuanci-integration-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          export LIYUANCI_TEST_DB_PASSWORD="$(openssl rand -hex 24)"
          make integration
      - if: always()
        run: docker compose -f deploy/compose/integration.yaml down
        env:
          LIYUANCI_TEST_DB_PASSWORD: cleanup-only-placeholder
