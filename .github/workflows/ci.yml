name: T004 foundation checks (REQ-020)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # T004/REQ-018、020：独立验证真实采集链路，不复用业务或中间件测试项目。
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-observability.py --alerts
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: make fmt
      - run: git diff --exit-code
      - run: make check
      - run: make build
  middleware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # T004/REQ-020：跨步骤使用同一唯一项目，失败清理不会误指向默认项目。
    env:
      COMPOSE_PROJECT_NAME: liyuanci-t004-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/integration.sh
      - if: always()
        run: docker compose -f compose.integration.yaml down
        env:
          LIYUANCI_TEST_DB_PASSWORD: cleanup-only-placeholder
