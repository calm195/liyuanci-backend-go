name: 工程基础检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  services-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 真实启停/重启/数据保留，端口只用于该独立runner。
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-services.py
  middleware-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 随机隔离凭据；统计身份与错误凭据正反例。
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-management.py --middleware-only --metrics
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 独立验证真实采集链路，不复用业务或中间件测试项目。
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-observability.py --alerts --metrics --linux-host
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: make fmt
      - run: git diff --exit-code
      - run: make check
      - run: python3 -m unittest discover -s scripts -p test_services.py -v
      - run: make build
  middleware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 跨步骤使用同一唯一项目，失败清理不会误指向默认项目。
    env:
      COMPOSE_PROJECT_NAME: liyuanci-integration-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/integration.sh
      - if: always()
        run: docker compose -f compose.integration.yaml down
        env:
          LIYUANCI_TEST_DB_PASSWORD: cleanup-only-placeholder
